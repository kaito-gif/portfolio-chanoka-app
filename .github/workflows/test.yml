name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  noshi-wrap-free:
    # ubuntu-latest(glibc)を使う。Alpine(musl)ベースのイメージは、Shopify CLIが
    # javy/wasm-opt/trampolineバイナリの実行に失敗する既知の不具合があった
    # (CLI 3.73〜3.84、3.85.4で修正済み。本リポジトリのCLIは4.6.1だが、
    # 念のためglibcイメージを使う方針は維持する)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm workspaces構成のため、extensions/noshi-wrap-free配下でnpm ciを
          # 実行してもリポジトリルートのpackage.json(依存: @shopify/cli@4.6.1、
          # engines.node >=22.12.0)まで解決対象になる。node 20ではEBADENGINEで
          # 落ちるため22系を使う(2026-08-16実測)。
          node-version: 22
      # ルートで npm ci する。テストは `shopify app function build` を裏で叩くため、
      # ルートのnode_modules/.bin/shopify(@shopify/cli)がインストールされている必要が
      # ある。extensions/noshi-wrap-free配下だけで npm ci すると shopify バイナリが
      # 入らず `spawn shopify ENOENT` になる(2026-08-16実測)。
      - run: npm ci
      - working-directory: extensions/noshi-wrap-free
        run: npm test -- --run
