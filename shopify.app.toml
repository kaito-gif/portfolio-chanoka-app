# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "be04894d1a1df2c1033f874658422347"
name = "noshi-gift-app"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_cart_transforms は Cart Transform(expand)を廃止したため不要になった(2026-08-14)。
scopes = "write_discounts,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# 熨斗の表書き（御中元・御歳暮など）のマスタ。
# 選択肢をコードに持たず、マーチャントが管理画面から増減できる形にするための定義。
# access.admin = merchant_read_write … 管理画面からエントリーを編集させる
# access.storefront = public_read     … カートページの入力ブロックから読む
[metaobjects.app.noshi_title]
name = "熨斗の表書き"
description = "熨斗に印字する表書きの選択肢"
display_name_field = "label"
access.admin = "merchant_read_write"
access.storefront = "public_read"
capabilities.publishable = true

[metaobjects.app.noshi_title.fields.label]
name = "表書き"
description = "熨斗に印字する文言（例: 御中元）"
type = "single_line_text_field"
required = true

[metaobjects.app.noshi_title.fields.display_order]
name = "並び順"
description = "カートの選択肢に並べる順序。小さいほど先"
type = "number_integer"

# のし代・包装料の設定（variant ID・包装料無料のしきい値）。
# noshi-cart（Theme App Extension）と noshi-wrap-free（Discount）の両方が
# ここを参照する。片方だけ直して variant ID やしきい値がずれる事故を防ぐための一元化。
# 単価そのものは 2026-08-14 の設計変更（Cart Transform expand の廃止）以降、
# ダミー商品（のし代・包装料）の Admin 上の variant 価格が正になった。この
# metafield にはもう単価を持たせない（noshiFeeAmount / wrapFeeAmount は廃止）。
# マーチャントが管理画面から誤って書き換えられないよう access.admin は付けない。
# access.storefront = public_read … カートページのブロック・JS から variant ID を読む
[shop.metafields.app.noshi_settings]
name = "熨斗設定"
description = "のし代・包装料のvariant ID、包装料無料のしきい値（JSON）"
type = "json"
access.storefront = "public_read"
