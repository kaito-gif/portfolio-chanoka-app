# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "be04894d1a1df2c1033f874658422347"
name = "noshi-gift-app"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_publications は のし代・包装料ダミー商品をオンラインストアチャネルに公開するために追加した
# (独立行化方式では /cart/add.js がオンラインストア未公開の商品を追加できないため。2026-08-14実測)。
# write_cart_transforms は開発ストアに残る旧 CartTransform オブジェクト削除のため一時追加したが、
# 確認したところ既に存在しなかった(noshi-fee拡張の削除時に自動で消えていたとみられる)ため撤去した。
# write_orders は構成要素#5(受注画面の熨斗カード)が注文のline itemを読み(2026-08-15)、
# 構成要素#9(受注後の熨斗の訂正・FR-18)がOrder metafieldへ訂正値を書くために必要
# (2026-08-15、read_ordersから差し替え)。60日より前の注文を読む要件はないため
# read_all_orders は追加しない(審査で用途を問われうるスコープのため、必要になるまで持たない)。
scopes = "write_discounts,write_products,write_publications,write_orders"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# 熨斗の表書き（御中元・御歳暮など）のマスタ。
# 選択肢をコードに持たず、マーチャントが管理画面から増減できる形にするための定義。
# access.admin = merchant_read_write … 管理画面からエントリーを編集させる
# access.storefront = public_read     … カートページの入力ブロックから読む
[metaobjects.app.noshi_title]
name = "熨斗の表書き"
description = "熨斗に印字する表書きの選択肢"
display_name_field = "label"
access.admin = "merchant_read_write"
access.storefront = "public_read"
capabilities.publishable = true

[metaobjects.app.noshi_title.fields.label]
name = "表書き"
description = "熨斗に印字する文言（例: 御中元）"
type = "single_line_text_field"
required = true

[metaobjects.app.noshi_title.fields.display_order]
name = "並び順"
description = "カートの選択肢に並べる順序。小さいほど先"
type = "number_integer"

# のし代・包装料の設定（variant ID・包装料無料のしきい値）。
# noshi-cart（Theme App Extension）と noshi-wrap-free（Discount）の両方が
# ここを参照する。片方だけ直して variant ID やしきい値がずれる事故を防ぐための一元化。
# 単価そのものは 2026-08-14 の設計変更（Cart Transform expand の廃止）以降、
# ダミー商品（のし代・包装料）の Admin 上の variant 価格が正になった。この
# metafield にはもう単価を持たせない（noshiFeeAmount / wrapFeeAmount は廃止）。
# マーチャントが管理画面から誤って書き換えられないよう access.admin は付けない。
# access.storefront = public_read … カートページのブロック・JS から variant ID を読む
[shop.metafields.app.noshi_settings]
name = "熨斗設定"
description = "のし代・包装料のvariant ID、包装料無料のしきい値（JSON）"
type = "json"
access.storefront = "public_read"

# 構成要素#9(受注後の熨斗の訂正・FR-18)の受け皿。line item properties は注文確定後
# 書き換えられないため、訂正値はOrder metafieldに別データとして持つ(元の入力値は
# line item側にそのまま残る。詳細設計5.3)。値は { [lineItemId]: { 表書き, 名入れ, のし種別 } }
# のJSON。書き込みは metafieldsSet + write_orders。マーチャント(受注担当)が直接編集する
# 想定はなく、noshi-order-block からのみ読み書きするため access.admin は付けない。
[order.metafields.app.noshi_correction]
name = "熨斗訂正"
description = "受注後に出荷担当が訂正した熨斗情報（JSON）"
type = "json"
