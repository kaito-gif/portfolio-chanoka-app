query CartInput {
  shop {
    noshiSettings: metafield(namespace: "$app", key: "noshi_settings") {
      jsonValue
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      id
      quantity
      noshiTitle: attribute(key: "表書き") {
        value
      }
    }
  }
  discount {
    discountClasses
  }
}
