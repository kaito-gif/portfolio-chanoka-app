query CartInput {
  shop {
    noshiSettings: metafield(namespace: "$app", key: "noshi_settings") {
      jsonValue
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
